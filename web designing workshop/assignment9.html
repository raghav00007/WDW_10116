<!DOCTYPE html>
<html>
<head>
    <title>Quotations</title>
</head>
<body>
<h1>Quotation Elements</h1>

    <h2>Blockquote</h2>

    <blockquote>
        Learning never exhausts the mind.
    </blockquote>

    <h2>Short Quotation</h2>

    <p>
        He said, <q>Practice makes progress.</q>
    </p>

    <h2>Citation</h2>

    <p>
        <cite>Web Designing Basics</cite>
        is a learning resource.
    </p>

    <h2>Abbreviation</h2>

    <p>
        <abbr title="World Wide Web Consortium">
            W3C
        </abbr>
        develops web standards.
    </p>

    <h2>Address</h2>

    <address>
        Written by a Web Designing Student.
    </address>

</body>
</html>

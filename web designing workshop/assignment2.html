<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>
  <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <p>This is a paragraph.</p>

    <b>Bold Text</b><br>
    <i>Italic Text</i><br>
    <u>Underlined Text</u><br>
    <mark>Highlighted Text</mark><br>

    H<sub>2</sub>O<br>
    X<sup>2</sup><br>

    <hr>

    Line One<br>
    Line Two

    <p>Copyright &copy; 2026</p>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Multimedia</title>
</head>
<body>
 <h1>HTML Multimedia</h1>

    <h2>Image</h2>

    <img src="college.jpg"
         alt="College Image"
         width="300">

    <h2>Video</h2>

    <video width="320" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <h2>Audio</h2>

    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>YouTube Video</h2>

    <iframe width="320"
            height="180"
            src="https://www.youtube.com/embed/<iframe width="560" height="315" src="https://www.youtube.com/embed/3pnpz8SqRI8?si=Mk103fScM5rDXYnP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>"
            title="YouTube Video"
            allowfullscreen>
    </iframe>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Block and Inline</title>
</head>
<body>
<h2>Block Elements</h2>

    <div style="background-color: lightblue;">
        Block Element 1
    </div>

    <div style="background-color: lightblue;">
        Block Element 2
    </div>

    <p>This is a paragraph.</p>

    <h2>Inline Elements</h2>

    <span style="background-color: lightgreen;">
        Inline Element 1
    </span>

    <span style="background-color: lightgreen;">
        Inline Element 2
    </span>

    <b>Bold Inline Element</b>

</body>
</html>

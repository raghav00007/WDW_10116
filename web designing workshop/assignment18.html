<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ABC College Admission 2026</title>

    <style>

        body {
            font-family: Arial;
            margin: 20px;
        }

        header, footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        form {
            max-width: 500px;
            border: 1px solid black;
            padding: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px;
        }

    </style>

</head>

<body>

    <a href="#main">
        Skip to Main Content
    </a>

    <header>

        <h1>ABC College</h1>

        <p>Admission Portal 2026</p>

    </header>

    <main id="main">

        <h2>Available Courses</h2>

        <table>

            <caption>Course Details</caption>

            <thead>

                <tr>
                    <th>Course</th>
                    <th>Duration</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>B.Tech CSE</td>
                    <td>4 Years</td>
                    <td>120</td>
                    <td>90000</td>
                </tr>

                <tr>
                    <td>BCA</td>
                    <td>3 Years</td>
                    <td>60</td>
                    <td>45000</td>
                </tr>

            </tbody>

        </table>

        <h2>Student Admission Form</h2>

        <form action="submit.php" method="post">

            <fieldset>

                <legend>Personal Details</legend>

                <label for="student">
                    Student Name:
                </label>

                <input type="text"
                       id="student"
                       name="student"
                       required>

                <label for="email">
                    Email:
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       required>

                <label for="phone">
                    Mobile Number:
                </label>

                <input type="text"
                       id="phone"
                       name="phone"
                       pattern="[0-9]{10}"
                       required>

                <label for="course">
                    Select Course:
                </label>

                <select id="course"
                        name="course"
                        required>

                    <option value="">
                        Select Course
                    </option>

                    <option value="btech">
                        B.Tech CSE
                    </option>

                    <option value="bca">
                        BCA
                    </option>

                </select>

                <label for="address">
                    Address:
                </label>

                <textarea id="address"
                          name="address"
                          rows="4">
                </textarea>

                <button type="submit">
                    Apply Now
                </button>

            </fieldset>

        </form>

    </main>

    <footer>

        <p>Copyright 2026 ABC College</p>

    </footer>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
    
 <title>Student Marks</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
        }
    </style>

</head>
<body>

    <h1>Student Marks Table</h1>

    <table>

        <caption>Student Marks</caption>

        <thead>

            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>Riya</td>
                <td>90</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Rohan</td>
                <td>82</td>
            </tr>

        </tbody>

        <tfoot>

            <tr>
                <th colspan="2">Average</th>
                <td>86</td>
            </tr>

        </tfoot>

    </table>

</body>
</html>

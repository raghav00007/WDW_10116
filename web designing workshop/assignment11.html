<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <title>Accessible Webpage</title>
</head>
<body>

    <a href="#main-content">
        Skip to Main Content
    </a>

    <header>
        <h1>Accessible Webpage</h1>
    </header>

    <nav aria-label="Main Navigation">

        <a href="#home">Home</a>

        <a href="#about">About</a>

    </nav>

    <main id="main-content">

        <h2>Welcome</h2>

        <img src="college.jpg"
             alt="College Building"
             width="200">

        <form role="search" aria-label="Website Search">

            <label for="search">Search:</label>

            <input type="search" id="search">

            <button type="submit"
                    aria-label="Submit Search">
                Search
            </button>

        </form>

    </main>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h1>Student Registration</h1>

    <form action="submit.php" method="post">

        <label for="name">Full Name:</label>

        <input type="text"
               id="name"
               name="name"
               required>

        <br><br>

        <label for="email">Email:</label>

        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>

        <label for="mobile">Mobile Number:</label>

        <input type="text"
               id="mobile"
               name="mobile"
               pattern="[0-9]{10}"
               title="Enter exactly 10 digits"
               required>

        <br><br>

        <label for="password">Password:</label>

        <input type="password"
               id="password"
               name="password"
               minlength="8"
               required>

        <br><br>

        <label for="age">Age:</label>

        <input type="number"
               id="age"
               name="age"
               min="18"
               max="30"
               required>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>
</body>
</html>
